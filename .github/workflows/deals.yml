name: Post India deals

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: india-deals-bot
  cancel-in-progress: false

jobs:
  post-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore notification state
        uses: actions/cache/restore@v4
        with:
          path: .deals-state.json
          key: deals-state-${{ github.run_id }}
          restore-keys: |
            deals-state-

      - name: Install bot
        run: python -m pip install .

      - name: Fetch and post deals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          FLIPKART_AFFILIATE_ID: ${{ secrets.FLIPKART_AFFILIATE_ID }}
          FLIPKART_AFFILIATE_TOKEN: ${{ secrets.FLIPKART_AFFILIATE_TOKEN }}
          JSON_FEED_URLS: ${{ vars.JSON_FEED_URLS }}
          DEAL_KEYWORDS: ${{ vars.DEAL_KEYWORDS || 'electronics,mobiles,laptops,appliances,fashion' }}
          MIN_DISCOUNT_PERCENT: ${{ vars.MIN_DISCOUNT_PERCENT || '30' }}
          MAX_DEALS_PER_RUN: ${{ vars.MAX_DEALS_PER_RUN || '10' }}
        run: india-deals-bot

      - name: Save notification state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .deals-state.json
          key: deals-state-${{ github.run_id }}
