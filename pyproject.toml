[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "india-deals-telegram-bot"
version = "0.1.0"
description = "Posts high-discount India shopping deals to a Telegram group."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
india-deals-bot = "india_deals_bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
