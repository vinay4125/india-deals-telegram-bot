name: Post public showcase

on:
  schedule:
    - cron: "30 3,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: india-deals-showcase
  cancel-in-progress: false

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install bot
        run: python -m pip install .

      - name: Post showcase
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m india_deals_bot.showcase
