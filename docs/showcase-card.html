<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #17221c;
      background:
        radial-gradient(circle at 82% 18%, #d9f36a 0 14%, transparent 14.2%),
        linear-gradient(135deg, #f7f5ec 0%, #edf5dd 100%);
      font-family: Inter, "Segoe UI", sans-serif;
    }
    main { width: 1040px; }
    .tag {
      color: #0d684a;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    h1 {
      width: 900px;
      margin: 24px 0;
      font-size: 88px;
      line-height: .95;
      letter-spacing: -.055em;
    }
    p { width: 760px; margin: 0; color: #526158; font-size: 31px; line-height: 1.35; }
    .pill {
      display: inline-block;
      margin-top: 36px;
      padding: 14px 22px;
      border-radius: 10px;
      color: white;
      background: #0d684a;
      font-size: 24px;
      font-weight: 750;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">India Best Deals</div>
    <h1>Smarter deals.<br>Less noise.</h1>
    <p>Official shopping promotions, useful buying guidance and public alerts for Indian shoppers.</p>
    <div class="pill">₹1 deals · Flash offers · Shopping guides</div>
  </main>
</body>
</html>
